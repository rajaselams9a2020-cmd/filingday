name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: fake
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Test
        run: pytest -q

  docker-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t filingday:ci .
      - name: Start container and check health
        run: |
          docker run -d --name api -p 8000:8000 -e LLM_PROVIDER=fake filingday:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health; then
              curl -fsS http://localhost:8000/ready
              exit 0
            fi
            sleep 1
          done
          docker logs api
          exit 1